<!DOCTYPE html>
{% load static %}
<html lang="en">
   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>
        {% block title %}{% endblock %} - FreeBSD pkg-fallout
      </title>
      <link rel="stylesheet" href="{% static 'css/portsfallout.css' %}?v=1.10.1">

      <script>
        // Stamp the stored theme before the first paint, otherwise the page
        // renders in the system theme and then flips.
        (function () {
          var m = document.cookie.match(/(?:^|;\s*)themePreference=(light|dark)/);
          if (m) { document.documentElement.setAttribute('data-theme', m[1]); }
        })();
      </script>

      <!-- favicon -->
      <link rel="apple-touch-icon" sizes="120x120" href="{% static "apple-touch-icon.png" %}">
      <link rel="icon" type="image/png" sizes="32x32" href="{% static "favicon-32x32.png" %}">
      <link rel="icon" type="image/png" sizes="16x16" href="{% static "favicon-16x16.png" %}">
      <link rel="manifest" href="{% static "site.webmanifest" %}">
      <link rel="mask-icon" href="{% static "safari-pinned-tab.svg" %}" color="#5bbad5">
      <meta name="msapplication-TileColor" content="#da532c">
      <meta name="theme-color" content="#800000">
   </head>
   <body>
    <nav class="nav">
      <div class="nav-inner">
        <a class="nav-brand" href="{% url 'ports:index' %}"><img src="{% static "fallout-48-w.png" %}" alt="PortsFallout"></a>

        <details class="nav-menu {{ navbar_fallout }}{{ navbar_fallout_be }}{{ navbar_fallout_mt }}">
          <summary>Fallouts</summary>
          <div>
            <a class="{{ navbar_fallout }}" href="{% url 'ports:fallout' %}">all pkg-fallouts</a>
            <a class="{{ navbar_fallout_be }}" href="{% url 'ports:build_env' %}">by build environment</a>
            <a class="{{ navbar_fallout_mt }}" href="{% url 'ports:maintainer' %}">by maintainers</a>
          </div>
        </details>

        <a class="nav-link {{ navbar_list }}" href="{% url 'ports:list' %}">Ports</a>
        <a class="nav-link {{ navbar_server }}" href="{% url 'ports:server' %}">Servers</a>
        <span class="nav-sep">|</span>
        <a class="nav-link {{ navbar_about }}" href="{% url 'ports:about' %}">About</a>
        <a class="nav-link" href="/api/">Api</a>
        <span class="spacer"></span>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false">auto</button>
      </div>
    </nav>

    <main class="page">
      <div class="container stack">
      {% block body_block %}
      {% endblock %}
      </div>
    </main>

    <footer class="site">
      <div class="container">PortsFallout (2020-2026)</div>
    </footer>

    <script src="{% static 'js/theme_toggle.js' %}?v=1.10.1"></script>
    <script>
      // Close the navbar dropdown when the click lands outside of it.
      document.addEventListener('click', function (event) {
        document.querySelectorAll('details.nav-menu[open]').forEach(function (menu) {
          if (!menu.contains(event.target)) { menu.open = false; }
        });
      });
    </script>
   </body>
</html>
